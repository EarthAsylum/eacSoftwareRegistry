# GitHub workflow action when creating/editing a release:
#   Adds {plugin-name}.{version}.zip to release assets.
#
# wordpress.org plugin slug is the repository name (upper/lower case is retained).
# Expects tag name to be version (M.m.p) with or without preceding "v" (v1.2.3 or 1.2.3)
# Expects wordpress.org assets (screenshots, icons, banners) to be in /.wp-assets.
# Uses .distignore or default '.*' for exclusions from zip file.
#
# Version: 26.0813.1

name: Generate WordPress Zip on Release

on:
  release:
    types: [created,edited]

permissions:
  contents: write

env:
  REPO_NAME: ${{ github.event.repository.name }}
  TAG_NAME:  ${{ github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:

    - name: Plugin-Slug
      # SLUG is the plugin slug/folder name. Get VERSION, sans 'v', from TAG_NAME
      run: |
        echo "SLUG=${REPO_NAME}" >>${GITHUB_ENV}
        echo "VERSION=${TAG_NAME#v}" >>${GITHUB_ENV}

    - name: Checkout-Code
      # checkout the repository code
      uses: actions/checkout@v7

    - name: Create-Zip-Archive
      # .temp directory containing only files to include in zip archive
      run: |
        mkdir -p .temp/${SLUG}
        rsync -rc --exclude-from=.distignore --exclude='.temp' ./ ./.temp/${SLUG}/ || \
        rsync -rc --exclude='.*' ./ ./.temp/${SLUG}/
        cd .temp
        zip -r ../${REPO_NAME}.${VERSION}.zip ./${SLUG}

    - name: Upload-Release-Asset
      # upload {plugin-name}.{version}.zip to github release
      uses: softprops/action-gh-release@v3
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        files: ${{ github.workspace }}/${{ env.REPO_NAME }}.${{ env.VERSION }}.zip
