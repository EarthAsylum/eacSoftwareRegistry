# GitHub workflow action to create a WordPress plugin zip file when creating a new release.
#
# wordpress.org plugin slug is the lower-case version of the repository name.
# Expects tag name to be version (M.m.p) with or without proceeding "v" (v1.2.3 or 1.2.3)
# Uses .distignore or default '.*' for exclusions from zip file.

name: Generate WordPress Zip on Release

on:
  release:
    types: [created,edited]

env:
  REPO_NAME: ${{ github.event.repository.name }}
  TAG_NAME:  ${{ github.ref_name }}

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:

    - name: Plugin-Slug
      # SLUG is the plugin slug/folder name, used by deploy. Get VERSION from TAG_NAME
      run: |
        echo "SLUG=${REPO_NAME}" >>${GITHUB_ENV}
        echo "VERSION=${TAG_NAME#v}" >>${GITHUB_ENV}

    - name: Checkout-Code
      # checkout the repository code
      uses: actions/checkout@v7

    - name: Prepare-Zip-Archive
      # Temp directory containing only files to include in zip archive
      run: |
        mkdir -p .build/${SLUG}
        rsync -rc --exclude-from=.distignore ./ ./.build/${SLUG}/ || \
        rsync -rc --exclude='.*' ./ ./.build/${SLUG}/

    - name: Create-Zip-Archive
      # create {plugin}.{version}.zip
      run: |
        cd .build
        zip -r ../${REPO_NAME}.${VERSION}.zip ./${SLUG}

    - name: Upload-Release-Asset
      # upload {plugin-name}.{version}.zip to github release
      uses: softprops/action-gh-release@v3
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        files: ${{ github.workspace }}/${{ env.REPO_NAME }}.${{ env.VERSION }}.zip
